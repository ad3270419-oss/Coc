<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoC Potion Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Dark blue/purple gradient matching Clash of Clans night village / magic theme */
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Glassmorphism styling */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: #FACC15; /* Gold focus */
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        /* CoC Accent Colors */
        .text-gold { color: #FACC15; }
        .text-elixir { color: #EC4899; }
        .bg-gold { background-color: #FACC15; }
        .bg-elixir { background-color: #EC4899; }

        /* Custom Button */
        .btn-calculate {
            background: linear-gradient(to right, #EC4899, #8B5CF6);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.1s, box-shadow 0.3s;
        }
        .btn-calculate:active {
            transform: scale(0.97);
        }

        /* Animations */
        .hidden-result {
            opacity: 0;
            display: none;
        }

        .show-result {
            display: block;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <div class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 relative overflow-hidden">
        <!-- Decorative glowing orbs behind the content -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-pink-500 rounded-full mix-blend-screen filter blur-[50px] opacity-40"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-yellow-500 rounded-full mix-blend-screen filter blur-[50px] opacity-30"></div>

        <!-- Header -->
        <div class="text-center mb-6 relative z-10">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">
                Builder <span class="text-elixir">Potion</span>
            </h1>
            <p class="text-gray-300 text-sm mt-1 uppercase tracking-widest text-gold text-xs font-semibold">Hammer Jam Calculator</p>
        </div>

        <!-- Mode Toggle -->
        <div class="flex bg-black/40 rounded-xl p-1 mb-6 border border-white/10 relative z-10">
            <button id="btn-mode-single" onclick="setMode('single')" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white/20 text-white shadow-sm transition-all">Single Builder</button>
            <button id="btn-mode-multi" onclick="setMode('multi')" class="flex-1 py-2 text-sm font-semibold rounded-lg text-gray-400 hover:text-white transition-all">All Builders</button>
        </div>

        <!-- Inputs Section -->
        <div class="space-y-6 relative z-10">
            
            <!-- Builders Slider (Hidden in single mode) -->
            <div id="multi-builders-config" class="hidden bg-black/20 p-4 rounded-2xl border border-white/5">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-sm text-gray-300 font-medium">Active Builders</label>
                    <div class="text-gold font-bold bg-black/40 px-3 py-1 rounded-lg shadow-inner"><span id="builders-count-label">2</span> 👷</div>
                </div>
                <input type="range" id="input-builders" min="1" max="7" value="2" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" style="accent-color: #EC4899;" oninput="updateBuilderInputs()">
            </div>

            <!-- Time Inputs Container (Injected dynamically by JS) -->
            <div id="time-inputs-container" class="space-y-4">
                <!-- Time inputs populate here -->
            </div>

            <!-- Potions Input -->
            <div>
                <label class="block text-sm text-gray-300 mb-2 font-medium flex justify-between items-end">
                    <span>Potions Used</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="text-lg">🧪</span>
                    </div>
                    <input type="number" id="input-potions" placeholder="0" min="0" class="glass-input w-full rounded-xl py-3 pl-10 pr-3 text-lg font-semibold placeholder-gray-500">
                </div>
            </div>

            <!-- Calculate & Reset Buttons -->
            <div class="flex gap-2.5 mt-4">
                <button onclick="calculateTime()" class="btn-calculate flex-1 text-white font-bold text-lg rounded-xl py-4 tracking-wide shadow-lg cursor-pointer">
                    Calculate Finish Time
                </button>
                <button onclick="resetAllTimes()" class="glass-input hover:border-pink-500/50 hover:bg-pink-500/10 text-gray-300 hover:text-white px-4 rounded-xl flex flex-col items-center justify-center gap-0.5 transition cursor-pointer" title="Reset all added days, hours, and minutes">
                    <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="text-[10px] font-semibold uppercase tracking-wider text-gray-300">Reset</span>
                </button>
            </div>
        </div>

        <!-- Results Section (Animated) -->
        <div id="results-container" class="hidden-result mt-8 pt-6 border-t border-white/10 relative z-10">
            
            <div id="results-content" class="space-y-3">
                <!-- Dynamically populated based on mode -->
            </div>
            
            <div class="bg-black/30 rounded-2xl p-4 mt-4 border border-white/5 flex justify-between items-center">
                <p class="text-xs text-gray-400 uppercase tracking-wider">Total Time Saved</p>
                <div id="result-saved" class="text-lg font-bold text-elixir">
                    <!-- Populated by JS -->
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentMode = 'single';

        function setMode(mode) {
            currentMode = mode;
            const btnSingle = document.getElementById('btn-mode-single');
            const btnMulti = document.getElementById('btn-mode-multi');
            const multiConfig = document.getElementById('multi-builders-config');
            
            // Handle Toggle Button Styling
            if (mode === 'single') {
                btnSingle.classList.replace('text-gray-400', 'text-white');
                btnSingle.classList.replace('hover:text-white', 'bg-white/20');
                btnSingle.classList.add('shadow-sm');
                
                btnMulti.classList.replace('text-white', 'text-gray-400');
                btnMulti.classList.replace('bg-white/20', 'hover:text-white');
                btnMulti.classList.remove('shadow-sm');
                
                multiConfig.classList.add('hidden');
            } else {
                btnMulti.classList.replace('text-gray-400', 'text-white');
                btnMulti.classList.replace('hover:text-white', 'bg-white/20');
                btnMulti.classList.add('shadow-sm');
                
                btnSingle.classList.replace('text-white', 'text-gray-400');
                btnSingle.classList.replace('bg-white/20', 'hover:text-white');
                btnSingle.classList.remove('shadow-sm');
                
                multiConfig.classList.remove('hidden');
            }
            
            updateBuilderInputs(); // Refresh inputs based on mode
            
            // Hide previous results when switching modes
            document.getElementById('results-container').classList.add('hidden-result');
            document.getElementById('results-container').classList.remove('show-result');
        }

        function updateBuilderInputs() {
            const container = document.getElementById('time-inputs-container');
            const numBuilders = currentMode === 'single' ? 1 : parseInt(document.getElementById('input-builders').value);
            document.getElementById('builders-count-label').innerText = numBuilders;
            
            // Preserve existing input values if the user changes the slider
            const existingValues = [];
            for (let i = 1; i <= 7; i++) {
                existingValues.push({
                    d: document.getElementById(`input-d-${i}`)?.value || '',
                    h: document.getElementById(`input-h-${i}`)?.value || '',
                    m: document.getElementById(`input-m-${i}`)?.value || ''
                });
            }

            container.innerHTML = '';
            
            // Generate exact number of time inputs required
            for (let i = 1; i <= numBuilders; i++) {
                const label = currentMode === 'single' ? 'Remaining Upgrade Time' : `Builder ${i} Remaining Time`;
                const div = document.createElement('div');
                div.className = i > 1 ? 'pt-2 border-t border-white/10 mt-2' : '';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm text-gray-300 font-medium">${label}</label>
                        <button type="button" onclick="resetBuilder(${i})" class="text-[11px] text-gray-400 hover:text-elixir transition px-2 py-0.5 rounded-md hover:bg-white/5 cursor-pointer">✕ Clear</button>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="flex flex-col">
                            <input type="number" id="input-d-${i}" value="${existingValues[i-1].d}" oninput="clampInput(this, 999)" placeholder="0" min="0" max="999" class="glass-input w-full rounded-xl py-3 px-2 text-center text-xl font-semibold placeholder-gray-500">
                            <span class="text-xs text-gray-400 text-center mt-1">Days</span>
                        </div>
                        <div class="flex flex-col">
                            <input type="number" id="input-h-${i}" value="${existingValues[i-1].h}" oninput="clampInput(this, 24)" placeholder="0" min="0" max="24" class="glass-input w-full rounded-xl py-3 px-2 text-center text-xl font-semibold placeholder-gray-500">
                            <span class="text-xs text-gray-400 text-center mt-1">Hours</span>
                        </div>
                        <div class="flex flex-col">
                            <input type="number" id="input-m-${i}" value="${existingValues[i-1].m}" oninput="clampInput(this, 60)" placeholder="0" min="0" max="60" class="glass-input w-full rounded-xl py-3 px-2 text-center text-xl font-semibold placeholder-gray-500">
                            <span class="text-xs text-gray-400 text-center mt-1">Mins</span>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function clampInput(el, maxVal) {
            const digits = el.value.replace(/\D/g, '');
            if (digits === '') {
                el.value = '';
                return;
            }
            let num = parseInt(digits, 10);
            if (num > maxVal) num = maxVal;
            el.value = String(num);
        }

        function resetBuilder(i) {
            const d = document.getElementById(`input-d-${i}`);
            const h = document.getElementById(`input-h-${i}`);
            const m = document.getElementById(`input-m-${i}`);
            if (d) d.value = '';
            if (h) h.value = '';
            if (m) m.value = '';
            document.getElementById('results-container').classList.add('hidden-result');
            document.getElementById('results-container').classList.remove('show-result');
        }

        function resetAllTimes() {
            for (let i = 1; i <= 7; i++) {
                resetBuilder(i);
            }
            document.getElementById('results-container').classList.add('hidden-result');
            document.getElementById('results-container').classList.remove('show-result');
        }

        function calcRealTime(totalBuilderHours, potions) {
            if (totalBuilderHours === 0) return 0;
            const maxPotionCoverageHours = potions * 10;
            // Potion cuts 10 builder hours into 1 real hour.
            if (totalBuilderHours <= maxPotionCoverageHours) {
                return totalBuilderHours / 10;
            } else {
                return totalBuilderHours - (potions * 9);
            }
        }

        function calculateTime() {
            const potions = Math.max(0, parseInt(document.getElementById('input-potions').value) || 0);
            const numBuilders = currentMode === 'single' ? 1 : parseInt(document.getElementById('input-builders').value);
            
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = '';
            
            const now = new Date();
            let hasCalculatedAnything = false;
            
            // Loop through active builder inputs and calculate dates
            for (let i = 1; i <= numBuilders; i++) {
                const d = Math.max(0, parseInt(document.getElementById(`input-d-${i}`).value) || 0);
                const h = Math.max(0, parseInt(document.getElementById(`input-h-${i}`).value) || 0);
                const m = Math.max(0, parseInt(document.getElementById(`input-m-${i}`).value) || 0);
                
                const totalBuilderHours = (d * 24) + h + (m / 60);
                if (totalBuilderHours === 0) continue; 
                
                hasCalculatedAnything = true;
                const realTimeHours = calcRealTime(totalBuilderHours, potions);
                const totalRealMinutes = Math.round(realTimeHours * 60);
                
                // Add the duration to the current time to get the exact finish date
                const completionDate = new Date(now.getTime() + (totalRealMinutes * 60 * 1000));
                const formattedDate = completionDate.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
                
                const realDays = Math.floor(totalRealMinutes / (24 * 60));
                const remainMinsAfterDays = totalRealMinutes % (24 * 60);
                const realHours = Math.floor(remainMinsAfterDays / 60);
                const realMins = remainMinsAfterDays % 60;
                
                let durationHTML = '';
                if (realDays > 0) durationHTML += `<span class="text-xl">${realDays}</span><span class="text-xs text-gray-400 mr-1">d</span>`;
                if (realHours > 0 || realDays > 0) durationHTML += `<span class="text-xl">${realHours}</span><span class="text-xs text-gray-400 mr-1">h</span>`;
                durationHTML += `<span class="text-xl">${realMins}</span><span class="text-xs text-gray-400">m</span>`;

                const builderLabel = currentMode === 'single' ? 'Upgrade' : `Builder ${i}`;
                
                // Add individual builder block to results
                resultsContent.innerHTML += `
                    <div class="bg-black/30 rounded-2xl p-4 border border-white/5 flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                        <div>
                            <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">${builderLabel} Completes On</p>
                            <div class="text-base font-bold text-gold">${formattedDate}</div>
                        </div>
                        <div class="text-left sm:text-right">
                            <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Actual Wait</p>
                            <div class="text-white flex items-baseline justify-start sm:justify-end gap-1">${durationHTML}</div>
                        </div>
                    </div>
                `;
            }

            if (!hasCalculatedAnything) return; // Exit if user hit calculate with 0 time everywhere

            // Calculate overall time saved across village
            const activeBuildersCount = currentMode === 'single' ? 1 : numBuilders;
            let totalSavedHoursAllBuilders = potions * 9 * activeBuildersCount;
            let savedDays = Math.floor(totalSavedHoursAllBuilders / 24);
            let savedHours = totalSavedHoursAllBuilders % 24;
            
            let savedText = "";
            if(potions === 0) {
                savedText = "0h";
            } else {
                if(savedDays > 0) savedText += `${savedDays}d `;
                if(savedHours > 0 || savedDays === 0) savedText += `${savedHours}h`;
            }
            
            document.getElementById('result-saved').innerText = savedText;

            // Trigger Result Pop-up Animation
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.classList.remove('show-result');
            resultsContainer.classList.add('hidden-result');
            
            void resultsContainer.offsetWidth; // Force a DOM reflow to restart animation
            
            resultsContainer.classList.remove('hidden-result');
            resultsContainer.classList.add('show-result');
        }

        // Initialize App on load
        window.onload = function() {
            setMode('single'); // Defaults to single view
        };
    </script>
</body>
</html>
