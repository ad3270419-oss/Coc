<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoC Potion Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: white;
            transition: transform 0.15s ease, border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.2s ease;
        }

        .glass-input:focus {
            outline: none;
            border-color: #FACC15;
            box-shadow: 0 0 10px rgba(250, 204, 21, 0.3);
            background: rgba(0, 0, 0, 0.45);
        }

        .goblin-input:focus {
            outline: none;
            border-color: #22c55e !important;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4) !important;
            background: rgba(0, 0, 0, 0.45);
        }

        .builder-card {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
            transition: transform 0.15s ease, border-color 0.25s ease;
        }

        .goblin-card {
            background: linear-gradient(145deg, rgba(6, 78, 59, 0.35) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(34, 197, 94, 0.4);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.15), inset 0 0 12px rgba(34, 197, 94, 0.08);
            transition: transform 0.15s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* Minimalist High-Contrast Builder Card Header Styles */
        .slot-badge-regular {
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 6px;
            padding: 2px 7px;
            font-weight: 800;
            font-size: 0.75rem;
            line-height: 1.25;
        }

        .slot-badge-hero {
            color: #e879f9;
            background: rgba(217, 70, 239, 0.14);
            border: 1px solid rgba(217, 70, 239, 0.4);
            border-radius: 6px;
            padding: 2px 7px;
            font-weight: 800;
            font-size: 0.75rem;
            line-height: 1.25;
        }

        .slot-badge-goblin {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 6px;
            padding: 2px 7px;
            font-weight: 800;
            font-size: 0.75rem;
            line-height: 1.25;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.2);
        }

        .upgrade-title {
            color: #ffffff;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.25px;
            line-height: 1.3;
        }

        .lvl-chip {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.35);
            color: #fbbf24;
            font-weight: 800;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            border-radius: 6px;
            padding: 2px 7px;
            line-height: 1.25;
        }

        .lvl-chip-goblin {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
            font-weight: 800;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
            border-radius: 6px;
            padding: 2px 7px;
            line-height: 1.25;
        }

        /* Dynamic Category Accent Left Borders */
        .accent-gold {
            border-left: 3px solid #fbbf24 !important;
        }

        .accent-hero {
            border-left: 3px solid #d946ef !important;
        }

        .accent-goblin {
            border-left: 3px solid #22c55e !important;
            box-shadow: -2px 0 8px rgba(34, 197, 94, 0.3), 0 0 20px rgba(34, 197, 94, 0.15), inset 0 0 12px rgba(34, 197, 94, 0.08) !important;
        }

        .builder-header-sep {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .tactile {
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
        }
        .tactile:active,
        .glass-input:active,
        .btn-calculate:active {
            transform: scale(0.96);
        }

        .text-gold { color: #FACC15; }
        .text-elixir { color: #EC4899; }
        .bg-gold { background-color: #FACC15; }
        .bg-elixir { background-color: #EC4899; }

        .btn-calculate {
            background: linear-gradient(to right, #EC4899, #8B5CF6);
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
            transition: transform 0.15s ease, box-shadow 0.3s;
        }

        .hidden-result {
            opacity: 0;
            display: none;
        }

        .show-result {
            display: block;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 4-Unit HUD Live Countdown Ticker & Tiered Animations */
        .hud-unit {
            background: rgba(2, 6, 23, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
            font-variant-numeric: tabular-nums;
            will-change: transform, box-shadow, opacity;
        }

        .anim-sec-flip {
            animation: secSlideFlip 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes secSlideFlip {
            0% { transform: translateY(-4px); opacity: 0.8; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .anim-min-pulse {
            animation: minElixirPulse 0.48s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes minElixirPulse {
            0% { transform: scale(1); }
            40% {
                transform: scale(1.08);
                border-color: rgba(236, 72, 153, 0.85);
                box-shadow: 0 0 12px rgba(236, 72, 153, 0.55), inset 0 0 8px rgba(236, 72, 153, 0.25);
            }
            100% {
                transform: scale(1);
                border-color: rgba(255, 255, 255, 0.14);
                box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
            }
        }

        .anim-milestone-gold {
            animation: milestoneGoldFlash 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes milestoneGoldFlash {
            0% { transform: scale(1); }
            35% {
                transform: scale(1.12);
                border-color: rgba(251, 191, 36, 0.95);
                box-shadow: 0 0 12px rgba(251, 191, 36, 0.6), inset 0 0 10px rgba(251, 191, 36, 0.3);
            }
            100% {
                transform: scale(1);
                border-color: rgba(255, 255, 255, 0.14);
                box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
            }
        }

        .badge-finished-glow {
            background: linear-gradient(90deg, rgba(16, 185, 129, 0.22) 0%, rgba(34, 197, 94, 0.32) 100%);
            border: 1px solid rgba(34, 197, 94, 0.6);
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.35), inset 0 0 8px rgba(34, 197, 94, 0.15);
            animation: finishedPopIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes finishedPopIn {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6">

    <!-- Toast Notification -->
    <div id="toast-box" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl font-extrabold text-xs sm:text-sm shadow-2xl border flex items-center gap-2 transition-all"></div>

    <div class="glass-card w-full max-w-md rounded-3xl p-5 sm:p-8 relative overflow-hidden my-auto">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-pink-500 rounded-full mix-blend-screen filter blur-[50px] opacity-40 pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-yellow-500 rounded-full mix-blend-screen filter blur-[50px] opacity-30 pointer-events-none"></div>

        <!-- Header + Import CoC JSON Button -->
        <div class="text-center mb-5 relative z-10">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-wide">
                Builder <span class="text-elixir">Potion</span>
            </h1>
            <p class="text-gray-300 text-sm mt-1 uppercase tracking-widest text-gold text-xs font-semibold">Hammer Jam Calculator</p>
            <div class="mt-3.5 flex justify-center">
                <button type="button" onclick="openImportModal()" class="tactile inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold text-[#f8fafc] bg-gradient-to-r from-amber-500/20 via-pink-500/20 to-purple-500/20 border border-amber-400/50 shadow-[0_0_15px_rgba(251,191,36,0.25)] cursor-pointer">
                    <span>📥 Import CoC JSON</span>
                </button>
            </div>
        </div>

        <!-- Mode Toggle -->
        <div class="flex bg-black/40 rounded-xl p-1 mb-6 border border-white/10 relative z-10">
            <button id="btn-mode-single" onclick="setMode('single')" class="tactile flex-1 py-2.5 text-sm font-bold rounded-lg bg-white/20 text-white shadow-sm transition-all">Single Builder</button>
            <button id="btn-mode-multi" onclick="setMode('multi')" class="tactile flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-300 hover:text-white transition-all">All Builders</button>
        </div>

        <!-- Inputs Section -->
        <div class="space-y-6 relative z-10">
            <!-- Builders Slider (Hidden in single mode) -->
            <div id="multi-builders-config" class="hidden bg-black/30 p-4 rounded-2xl border border-white/10">
                <div class="flex justify-between items-center mb-3">
                    <label class="text-base text-[#f8fafc] font-bold">Active Builders</label>
                    <div id="builders-badge" class="text-[#fbbf24] font-extrabold bg-black/50 px-3 py-1 rounded-lg shadow-inner border border-amber-400/20">
                        <span id="builders-count-label">2</span> <span id="builders-icon">👷</span>
                    </div>
                </div>
                <input type="range" id="input-builders" min="1" max="7" value="2" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" style="accent-color: #EC4899;" oninput="onSliderChange()">
                <div class="flex justify-between text-[11px] font-semibold text-gray-300 mt-2 px-0.5">
                    <span>1 Builder</span>
                    <span>6 Builders</span>
                    <span class="text-emerald-400">7: Goblin 👺</span>
                </div>
            </div>

            <!-- Time Inputs Container -->
            <div id="time-inputs-container" class="space-y-4"></div>

            <!-- Potions Input -->
            <div class="builder-card rounded-2xl p-4">
                <label class="block text-base text-[#f8fafc] mb-2.5 font-extrabold flex justify-between items-center">
                    <span>🧪 Potions Used</span>
                    <button type="button" onclick="clearPotions()" class="tactile text-xs font-bold text-gray-300 hover:text-elixir bg-white/10 px-2 py-0.5 rounded-md">Clear</button>
                </label>
                <div class="flex items-center gap-2.5">
                    <button type="button" onclick="adjustPotions(-1)" class="tactile glass-input w-12 h-12 rounded-xl text-xl font-extrabold text-white flex items-center justify-center">−</button>
                    <input type="number" id="input-potions" oninput="clampInput(this, 999); saveState();" placeholder="0" min="0" max="999" class="glass-input flex-1 rounded-xl py-3 px-3 text-center text-xl font-extrabold placeholder-gray-500">
                    <button type="button" onclick="adjustPotions(1)" class="tactile glass-input w-12 h-12 rounded-xl text-xl font-extrabold text-[#fbbf24] flex items-center justify-center">+</button>
                </div>
            </div>

            <!-- Calculate & Reset Buttons -->
            <div class="flex gap-2.5 mt-4">
                <button onclick="calculateTime()" class="btn-calculate tactile flex-1 text-white font-bold text-lg rounded-xl py-4 tracking-wide shadow-lg cursor-pointer">
                    Calculate Finish Time
                </button>
                <button onclick="resetAllTimes()" class="tactile glass-input hover:border-pink-500/50 hover:bg-pink-500/10 text-gray-200 hover:text-white px-4 rounded-xl flex flex-col items-center justify-center gap-0.5 transition cursor-pointer" title="Reset all added days, hours, and minutes">
                    <svg class="w-5 h-5 text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="text-[10px] font-bold uppercase tracking-wider text-gray-200">Reset</span>
                </button>
            </div>
        </div>

        <!-- Results Section (Animated + 4-Unit HUD Live Ticker) -->
        <div id="results-container" class="hidden-result mt-8 pt-6 border-t border-white/15 relative z-10">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-1.5">
                    <span class="h-2 w-2 rounded-full bg-[#22c55e] animate-pulse"></span>
                    <span class="text-xs font-extrabold uppercase tracking-wider text-[#f8fafc]">Locked Finish Schedule</span>
                </div>
                <button type="button" onclick="unlockAndEditTimers()" class="tactile text-xs font-bold text-[#fbbf24] bg-amber-500/15 border border-amber-400/30 px-2.5 py-1 rounded-lg">Reset / Edit Timers</button>
            </div>

            <div id="results-content" class="space-y-3"></div>

            <div class="bg-black/40 rounded-2xl p-4 mt-4 border border-white/10 flex justify-between items-center">
                <p class="text-xs font-bold text-gray-200 uppercase tracking-wider">Total Time Saved</p>
                <div id="result-saved" class="text-lg font-extrabold text-elixir"></div>
            </div>
        </div>
    </div>

    <!-- Dark Obsidian JSON Import Modal -->
    <div id="import-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-4" onclick="closeImportModal()">
        <div class="w-full max-w-md rounded-3xl p-6 bg-[#090d16] border border-white/15 shadow-[0_0_40px_rgba(0,0,0,0.85)] space-y-4 relative overflow-hidden" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-lg">📥</span>
                    <h2 class="text-lg font-extrabold text-[#f8fafc]">Import CoC Village JSON</h2>
                </div>
                <button type="button" onclick="closeImportModal()" class="tactile text-gray-400 hover:text-white text-sm font-bold px-2.5 py-1 rounded-lg bg-white/5 cursor-pointer">✕</button>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">
                In Clash of Clans, go to <span class="text-[#fbbf24] font-bold">Settings → More Settings → Data Export → Copy</span> and paste your village JSON below.
            </p>
            <div class="relative">
                <textarea id="json-textarea" rows="6" placeholder="Paste your raw Clash of Clans village export JSON here..." class="glass-input w-full rounded-2xl p-3.5 text-xs font-mono text-gray-100 placeholder-gray-500 resize-none focus:outline-none"></textarea>
            </div>
            <div class="flex gap-2.5 pt-1">
                <button type="button" onclick="closeImportModal()" class="tactile flex-1 py-3 rounded-xl font-bold text-sm text-gray-200 bg-white/10 border border-white/10 cursor-pointer">Cancel</button>
                <button type="button" onclick="handleImportVillageJson()" class="btn-calculate tactile flex-1 py-3 rounded-xl font-extrabold text-sm text-white shadow-lg cursor-pointer">Import Timers</button>
            </div>
        </div>
    </div>

    <script>
        const COC_NAMES = {
            // Town Hall & Key Buildings
            1000000: "Army Camp",
            1000001: "Town Hall",
            1000002: "Elixir Collector",
            1000003: "Elixir Storage",
            1000004: "Gold Mine",
            1000005: "Gold Storage",
            1000006: "Barracks",
            1000007: "Laboratory",
            1000008: "Cannon",
            1000009: "Archer Tower",
            1000010: "Wall",
            1000011: "Wizard Tower",
            1000012: "Air Defense",
            1000013: "Mortar",
            1000014: "Clan Castle",
            1000015: "Builder's Hut",
            1000019: "Hidden Tesla",
            1000020: "Spell Factory",
            1000021: "X-Bow",
            1000023: "Dark Elixir Drill",
            1000024: "Dark Elixir Storage",
            1000026: "Dark Barracks",
            1000027: "Inferno Tower",
            1000028: "Air Sweeper",
            1000029: "Dark Spell Factory",
            1000031: "Eagle Artillery",
            1000032: "Bomb Tower",
            1000059: "Workshop",
            1000064: "B.O.B's Hut",
            1000067: "Scattershot",
            1000068: "Pet House",
            1000070: "Blacksmith",
            1000071: "Hero Hall",
            1000072: "Spell Tower",
            1000077: "Monolith",
            1000079: "Multi-Gear Tower",
            1000084: "Multi-Archer Tower",
            1000085: "Ricochet Cannon",
            1000086: "Revenge Tower",
            1000089: "Firespitter",
            1000093: "Helper Hut",
            1000097: "Crafting Station",
            1000102: "Super Wizard Tower",

            // Traps
            12000000: "Bomb",
            12000001: "Spring Trap",
            12000002: "Giant Bomb",
            12000005: "Air Bomb",
            12000006: "Seeking Air Mine",
            12000008: "Skeleton Trap",
            12000016: "Tornado Trap",
            12000020: "Giga Bomb",

            // Heroes
            28000000: "Barbarian King",
            28000001: "Archer Queen",
            28000002: "Grand Warden",
            28000003: "Battle Machine",
            28000004: "Royal Champion",
            28000005: "Battle Copter",
            28000006: "Minion Prince",
            28000007: "Dragon Duke",

            // Helpers & Assistants
            93000000: "Builder's Apprentice",
            93000001: "Lab Assistant",
            93000002: "Prospector"
        };

        const STORAGE_KEY = 'coc_builder_potion_saved_v2';
        let currentMode = 'single';
        let buildersState = Array.from({ length: 7 }, () => ({ d: '', h: '', m: '', s: 0, upgradeTitle: undefined, upgradeLevel: undefined, rawId: undefined }));
        let lockedResults = [];
        let lockedSavedText = '';
        let prevTickMap = {};
        let toastTimer = null;

        function triggerHaptic(pattern = 12) {
            try {
                if (navigator.vibrate) navigator.vibrate(pattern);
            } catch (e) {}
        }

        function resolveUpgradeName(rawId) {
            if (rawId === undefined || rawId === null) return "Defense Upgrade";
            return COC_NAMES[rawId] || COC_NAMES[Number(rawId)] || COC_NAMES[String(rawId)] || "Defense Upgrade";
        }

        function showToast(type, text) {
            const box = document.getElementById('toast-box');
            box.className = `fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl font-extrabold text-xs sm:text-sm shadow-2xl border flex items-center gap-2 transition-all ${
                type === 'success'
                    ? 'bg-emerald-950/95 text-[#22c55e] border-emerald-400/50'
                    : 'bg-rose-950/95 text-rose-300 border-rose-400/50'
            }`;
            box.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span><span>${text}</span>`;
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.className = 'hidden';
            }, 3500);
        }

        function openImportModal() {
            triggerHaptic(15);
            document.getElementById('import-modal').classList.remove('hidden');
        }

        function closeImportModal() {
            triggerHaptic();
            document.getElementById('import-modal').classList.add('hidden');
        }

        function handleImportVillageJson() {
            triggerHaptic(15);
            const raw = document.getElementById('json-textarea').value.trim();
            if (!raw) {
                showToast('error', 'Invalid JSON format');
                return;
            }
            let parsed;
            try {
                parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                    showToast('error', 'Invalid JSON format');
                    return;
                }
            } catch (e) {
                showToast('error', 'Invalid JSON format');
                return;
            }

            const homeItems = [
                ...(Array.isArray(parsed.buildings) ? parsed.buildings : []),
                ...(Array.isArray(parsed.traps) ? parsed.traps : []),
                ...(Array.isArray(parsed.heroes) ? parsed.heroes : [])
            ];

            const activeUpgrades = homeItems.filter(item => item && typeof item.timer === 'number' && item.timer > 0);
            if (activeUpgrades.length === 0) {
                showToast('error', 'No active Home Village upgrades found');
                return;
            }

            const goblinItem = activeUpgrades.find(item => item.extra === true);
            const regularItems = activeUpgrades.filter(item => item.extra !== true).slice(0, 6);

            buildersState = Array.from({ length: 7 }, () => ({ d: '', h: '', m: '', s: 0, upgradeTitle: undefined, upgradeLevel: undefined, rawId: undefined }));

            regularItems.forEach((item, idx) => {
                const timer = Math.max(0, Math.floor(item.timer || 0));
                const itemData = item.data !== undefined ? item.data : item.id;
                const rawIdStr = itemData !== undefined && itemData !== null ? String(itemData) : undefined;
                const upgradeName = COC_NAMES[itemData] || COC_NAMES[Number(itemData)] || COC_NAMES[String(itemData)] || "Defense Upgrade";
                buildersState[idx] = {
                    d: String(Math.floor(timer / 86400)),
                    h: String(Math.floor((timer % 86400) / 3600)),
                    m: String(Math.floor((timer % 3600) / 60)),
                    s: timer % 60,
                    upgradeTitle: upgradeName,
                    upgradeLevel: typeof item.lvl === 'number' ? item.lvl : undefined,
                    rawId: rawIdStr
                };
            });

            if (goblinItem) {
                const timer = Math.max(0, Math.floor(goblinItem.timer || 0));
                const goblinData = goblinItem.data !== undefined ? goblinItem.data : goblinItem.id;
                const rawIdStr = goblinData !== undefined && goblinData !== null ? String(goblinData) : undefined;
                const upgradeName = COC_NAMES[goblinData] || COC_NAMES[Number(goblinData)] || COC_NAMES[String(goblinData)] || "Defense Upgrade";
                buildersState[6] = {
                    d: String(Math.floor(timer / 86400)),
                    h: String(Math.floor((timer % 86400) / 3600)),
                    m: String(Math.floor((timer % 3600) / 60)),
                    s: timer % 60,
                    upgradeTitle: upgradeName,
                    upgradeLevel: typeof goblinItem.lvl === 'number' ? goblinItem.lvl : undefined,
                    rawId: rawIdStr
                };
            }

            const totalLoaded = regularItems.length + (goblinItem ? 1 : 0);
            const sliderCount = goblinItem ? 7 : Math.max(1, Math.min(6, regularItems.length));
            document.getElementById('input-builders').value = sliderCount;
            setMode('multi', true);
            closeImportModal();
            document.getElementById('json-textarea').value = '';
            calculateTime(true);
            showToast('success', `Loaded ${totalLoaded} active builders!`);
        }

        function retriggerClass(el, cls) {
            if (!el) return;
            el.classList.remove(cls);
            void el.offsetWidth;
            el.classList.add(cls);
        }

        function saveState() {
            const numBuilders = parseInt(document.getElementById('input-builders').value) || 2;
            const potions = document.getElementById('input-potions').value || '';
            for (let i = 1; i <= 7; i++) {
                const dEl = document.getElementById(`input-d-${i}`);
                const hEl = document.getElementById(`input-h-${i}`);
                const mEl = document.getElementById(`input-m-${i}`);
                if (dEl) buildersState[i - 1].d = dEl.value;
                if (hEl) buildersState[i - 1].h = hEl.value;
                if (mEl) buildersState[i - 1].m = mEl.value;
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                mode: currentMode,
                numBuilders,
                builders: buildersState,
                potions,
                lockedResults,
                lockedSavedText
            }));
        }

        function onSliderChange() {
            triggerHaptic(8);
            updateBuilderInputs();
            saveState();
        }

        function setMode(mode, skipHaptic) {
            if (!skipHaptic) triggerHaptic();
            currentMode = mode;
            const btnSingle = document.getElementById('btn-mode-single');
            const btnMulti = document.getElementById('btn-mode-multi');
            const multiConfig = document.getElementById('multi-builders-config');

            if (mode === 'single') {
                btnSingle.className = 'tactile flex-1 py-2.5 text-sm font-bold rounded-lg bg-white/20 text-white shadow-sm transition-all';
                btnMulti.className = 'tactile flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-300 hover:text-white transition-all';
                multiConfig.classList.add('hidden');
            } else {
                btnMulti.className = 'tactile flex-1 py-2.5 text-sm font-bold rounded-lg bg-white/20 text-white shadow-sm transition-all';
                btnSingle.className = 'tactile flex-1 py-2.5 text-sm font-bold rounded-lg text-gray-300 hover:text-white transition-all';
                multiConfig.classList.remove('hidden');
            }

            updateBuilderInputs();
            saveState();
        }

        function updateBuilderInputs() {
            const container = document.getElementById('time-inputs-container');
            const numBuilders = currentMode === 'single' ? 1 : parseInt(document.getElementById('input-builders').value);
            document.getElementById('builders-count-label').innerText = numBuilders;
            document.getElementById('builders-icon').innerText = numBuilders === 7 ? '👺' : '👷';

            container.innerHTML = '';

            for (let i = 1; i <= numBuilders; i++) {
                const isGoblin = currentMode === 'multi' && i === 7;
                const bVal = buildersState[i - 1] || { d: '', h: '', m: '', s: 0 };
                const isHero = !isGoblin && bVal.rawId && String(bVal.rawId).startsWith('28');
                const slotBadge = isGoblin ? '[GOBLIN]' : `[B${i}]`;
                const defaultTitle = currentMode === 'single' ? 'Remaining Time' : (isGoblin ? 'Goblin Builder' : `Builder ${i}`);
                const displayTitle = bVal.upgradeTitle || defaultTitle;
                const lvlChipClass = isGoblin ? 'lvl-chip-goblin' : 'lvl-chip';
                const lvlChipHtml = typeof bVal.upgradeLevel === 'number' ? `<span class="${lvlChipClass}">LVL ${bVal.upgradeLevel}</span>` : '';

                const cardAccentClass = isGoblin
                    ? 'goblin-card accent-goblin'
                    : isHero
                    ? 'builder-card accent-hero'
                    : 'builder-card accent-gold';

                const badgeClass = isGoblin
                    ? 'slot-badge-goblin'
                    : isHero
                    ? 'slot-badge-hero'
                    : 'slot-badge-regular';

                const div = document.createElement('div');
                div.className = `rounded-2xl p-4 ${cardAccentClass}`;
                div.innerHTML = `
                    <div class="builder-header-sep flex flex-wrap justify-between items-center gap-2">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="${badgeClass}">${slotBadge}</span>
                            <span class="upgrade-title">${displayTitle}</span>
                            ${lvlChipHtml}
                        </div>
                        <button type="button" onclick="resetBuilder(${i})" class="tactile text-xs font-bold text-gray-200 hover:text-elixir transition px-2 py-0.5 rounded-md bg-white/10 cursor-pointer">✕ Clear</button>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div class="flex flex-col">
                            <input type="number" id="input-d-${i}" value="${bVal.d}" oninput="clampInput(this, 999); buildersState[${i - 1}].s = 0; saveState();" placeholder="0" min="0" max="999" class="glass-input ${isGoblin ? 'goblin-input' : ''} w-full rounded-xl py-3 px-2 text-center text-xl font-bold placeholder-gray-500">
                            <span class="text-xs font-semibold text-gray-200 text-center mt-1">Days</span>
                        </div>
                        <div class="flex flex-col">
                            <input type="number" id="input-h-${i}" value="${bVal.h}" oninput="clampInput(this, 24); buildersState[${i - 1}].s = 0; saveState();" placeholder="0" min="0" max="24" class="glass-input ${isGoblin ? 'goblin-input' : ''} w-full rounded-xl py-3 px-2 text-center text-xl font-bold placeholder-gray-500">
                            <span class="text-xs font-semibold text-gray-200 text-center mt-1">Hours</span>
                        </div>
                        <div class="flex flex-col">
                            <input type="number" id="input-m-${i}" value="${bVal.m}" oninput="clampInput(this, 60); buildersState[${i - 1}].s = 0; saveState();" placeholder="0" min="0" max="60" class="glass-input ${isGoblin ? 'goblin-input' : ''} w-full rounded-xl py-3 px-2 text-center text-xl font-bold placeholder-gray-500">
                            <span class="text-xs font-semibold text-gray-200 text-center mt-1">Mins</span>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5 mt-3 pt-2.5 border-t border-white/10">
                        <button type="button" onclick="applyPreset(${i}, 0, 6)" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-white/10 text-[#f8fafc] border border-white/15">+6h</button>
                        <button type="button" onclick="applyPreset(${i}, 0, 12)" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-white/10 text-[#f8fafc] border border-white/15">+12h</button>
                        <button type="button" onclick="applyPreset(${i}, 1, 0)" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-white/10 text-[#f8fafc] border border-white/15">+1d</button>
                        <button type="button" onclick="applyPreset(${i}, 3, 0)" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-white/10 text-[#f8fafc] border border-white/15">+3d</button>
                        <button type="button" onclick="applyPreset(${i}, 5, 0)" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-white/10 text-[#f8fafc] border border-white/15">+5d</button>
                        <button type="button" onclick="applyPreset(${i}, 7, 0)" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-white/10 text-[#f8fafc] border border-white/15">+7d</button>
                        <button type="button" onclick="resetBuilder(${i})" class="tactile text-xs font-bold px-2.5 py-1 rounded-lg bg-rose-500/15 text-rose-300 border border-rose-500/30 ml-auto">Clear</button>
                    </div>
                `;
                container.appendChild(div);
            }
        }

        function applyPreset(i, addD, addH) {
            triggerHaptic();
            const dEl = document.getElementById(`input-d-${i}`);
            const hEl = document.getElementById(`input-h-${i}`);
            const curD = Math.max(0, parseInt(dEl.value) || 0);
            const curH = Math.max(0, parseInt(hEl.value) || 0);
            const totalH = curH + addH;
            const extraD = Math.floor(totalH / 24);
            dEl.value = Math.min(999, curD + addD + extraD);
            hEl.value = totalH % 24;
            buildersState[i - 1].s = 0;
            saveState();
        }

        function adjustPotions(delta) {
            triggerHaptic();
            const el = document.getElementById('input-potions');
            const cur = Math.max(0, parseInt(el.value) || 0);
            const next = Math.min(999, Math.max(0, cur + delta));
            el.value = next === 0 ? '' : String(next);
            saveState();
        }

        function clearPotions() {
            triggerHaptic();
            document.getElementById('input-potions').value = '';
            saveState();
        }

        function clampInput(el, maxVal) {
            const digits = el.value.replace(/\D/g, '');
            if (digits === '') {
                el.value = '';
                return;
            }
            let num = parseInt(digits, 10);
            if (num > maxVal) num = maxVal;
            el.value = String(num);
        }

        function resetBuilder(i) {
            triggerHaptic();
            buildersState[i - 1] = { d: '', h: '', m: '', s: 0, upgradeTitle: undefined, upgradeLevel: undefined, rawId: undefined };
            updateBuilderInputs();
            lockedResults = lockedResults.filter(r => r.builderIndex !== (i - 1));
            buildLockedResultsDOM();
            saveState();
        }

        function resetAllTimes() {
            triggerHaptic(15);
            buildersState = Array.from({ length: 7 }, () => ({ d: '', h: '', m: '', s: 0, upgradeTitle: undefined, upgradeLevel: undefined, rawId: undefined }));
            lockedResults = [];
            lockedSavedText = '';
            prevTickMap = {};
            updateBuilderInputs();
            document.getElementById('results-container').classList.add('hidden-result');
            document.getElementById('results-container').classList.remove('show-result');
            saveState();
        }

        function unlockAndEditTimers() {
            triggerHaptic();
            lockedResults = [];
            lockedSavedText = '';
            prevTickMap = {};
            document.getElementById('results-container').classList.add('hidden-result');
            document.getElementById('results-container').classList.remove('show-result');
            saveState();
        }

        function calcRealTime(totalBuilderHours, potions) {
            if (totalBuilderHours === 0) return 0;
            const maxPotionCoverageHours = potions * 10;
            if (totalBuilderHours <= maxPotionCoverageHours) {
                return totalBuilderHours / 10;
            } else {
                return totalBuilderHours - (potions * 9);
            }
        }

        function calculateTime(skipHaptic) {
            if (!skipHaptic) triggerHaptic(18);
            const potions = Math.max(0, parseInt(document.getElementById('input-potions').value) || 0);
            const numBuilders = currentMode === 'single' ? 1 : parseInt(document.getElementById('input-builders').value);
            const nowMs = Date.now();
            const computed = [];

            for (let i = 1; i <= numBuilders; i++) {
                const d = Math.max(0, parseInt(document.getElementById(`input-d-${i}`)?.value ?? buildersState[i - 1]?.d) || 0);
                const h = Math.max(0, parseInt(document.getElementById(`input-h-${i}`)?.value ?? buildersState[i - 1]?.h) || 0);
                const m = Math.max(0, parseInt(document.getElementById(`input-m-${i}`)?.value ?? buildersState[i - 1]?.m) || 0);
                const s = Math.max(0, buildersState[i - 1]?.s || 0);

                const totalBuilderHours = (d * 24) + h + (m / 60) + (s / 3600);
                if (totalBuilderHours === 0) continue;

                const realTimeHours = calcRealTime(totalBuilderHours, potions);
                const targetTimestamp = nowMs + Math.round(realTimeHours * 3600 * 1000);
                const completionDate = new Date(targetTimestamp);
                const formattedDate = completionDate.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
                const isGoblin = currentMode === 'multi' && i === 7;
                const slotBadge = isGoblin ? '[GOBLIN]' : `[B${i}]`;
                const defaultTitle = currentMode === 'single' ? 'Defense / Building Upgrade' : (isGoblin ? 'Goblin Builder' : `Builder ${i} Upgrade`);
                const upgradeTitle = buildersState[i - 1]?.upgradeTitle || defaultTitle;
                const upgradeLevel = buildersState[i - 1]?.upgradeLevel;
                const rawId = buildersState[i - 1]?.rawId;

                computed.push({
                    builderIndex: i - 1,
                    slotBadge,
                    upgradeTitle,
                    upgradeLevel,
                    rawId,
                    isGoblin,
                    targetTimestamp,
                    formattedDate
                });
            }

            if (computed.length === 0) return;

            let totalSavedHoursAllBuilders = potions * 9 * computed.length;
            let savedDays = Math.floor(totalSavedHoursAllBuilders / 24);
            let savedHours = totalSavedHoursAllBuilders % 24;

            let savedText = "";
            if (potions === 0) {
                savedText = "0h";
            } else {
                if (savedDays > 0) savedText += `${savedDays}d `;
                if (savedHours > 0 || savedDays === 0) savedText += `${savedHours}h`;
            }

            lockedResults = computed;
            lockedSavedText = savedText;
            prevTickMap = {};
            saveState();

            const resultsContainer = document.getElementById('results-container');
            resultsContainer.classList.remove('show-result');
            resultsContainer.classList.add('hidden-result');
            void resultsContainer.offsetWidth;
            buildLockedResultsDOM();
            resultsContainer.classList.remove('hidden-result');
            resultsContainer.classList.add('show-result');
        }

        function buildLockedResultsDOM() {
            const resultsContent = document.getElementById('results-content');
            const resultsContainer = document.getElementById('results-container');
            if (!lockedResults || lockedResults.length === 0) {
                resultsContainer.classList.add('hidden-result');
                resultsContainer.classList.remove('show-result');
                return;
            }

            const now = Date.now();
            resultsContent.innerHTML = '';

            lockedResults.forEach((item, idx) => {
                const remMs = item.targetTimestamp - now;
                const isFinished = remMs <= 0;
                const totalSecs = Math.max(0, Math.ceil(remMs / 1000));
                const d = Math.floor(totalSecs / 86400);
                const h = Math.floor((totalSecs % 86400) / 3600);
                const m = Math.floor((totalSecs % 3600) / 60);
                const s = totalSecs % 60;

                prevTickMap[idx] = { isFinished, d, h, m, s };

                const tickerHTML = isFinished
                    ? `<div class="badge-finished-glow w-full rounded-xl px-3 py-2.5 flex items-center justify-center gap-2 text-center">
                         <span class="text-xs sm:text-sm font-extrabold tracking-wide text-[#22c55e] uppercase">⚡ UPGRADE FINISHED! BUILDER FREE</span>
                       </div>`
                    : `<div id="hud-wrap-${idx}" class="w-full">
                         <p class="text-[10px] font-bold text-gray-300 uppercase tracking-wider mb-1.5">Live Countdown</p>
                         <div class="flex items-center justify-between sm:justify-start gap-1 sm:gap-1.5">
                           <div id="hud-box-d-${idx}" class="hud-unit flex-1 sm:flex-initial sm:min-w-[58px] rounded-xl px-2 py-1.5 flex items-baseline justify-center gap-0.5">
                             <span id="hud-val-d-${idx}" class="text-base sm:text-lg font-extrabold text-[#f8fafc] tracking-tight">${String(d).padStart(2, '0')}</span>
                             <span class="text-[10px] font-bold text-[#fbbf24]">d</span>
                           </div>
                           <span class="text-gray-400 font-extrabold text-xs select-none">:</span>
                           <div id="hud-box-h-${idx}" class="hud-unit flex-1 sm:flex-initial sm:min-w-[58px] rounded-xl px-2 py-1.5 flex items-baseline justify-center gap-0.5">
                             <span id="hud-val-h-${idx}" class="text-base sm:text-lg font-extrabold text-[#f8fafc] tracking-tight">${String(h).padStart(2, '0')}</span>
                             <span class="text-[10px] font-bold text-[#fbbf24]">h</span>
                           </div>
                           <span class="text-gray-400 font-extrabold text-xs select-none">:</span>
                           <div id="hud-box-m-${idx}" class="hud-unit flex-1 sm:flex-initial sm:min-w-[58px] rounded-xl px-2 py-1.5 flex items-baseline justify-center gap-0.5">
                             <span id="hud-val-m-${idx}" class="text-base sm:text-lg font-extrabold text-[#f8fafc] tracking-tight">${String(m).padStart(2, '0')}</span>
                             <span class="text-[10px] font-bold text-elixir">m</span>
                           </div>
                           <span class="text-gray-400 font-extrabold text-xs select-none">:</span>
                           <div class="hud-unit flex-1 sm:flex-initial sm:min-w-[58px] rounded-xl px-2 py-1.5 flex items-baseline justify-center gap-0.5 overflow-hidden">
                             <span id="hud-val-s-${idx}" class="inline-block text-base sm:text-lg font-extrabold text-[#fbbf24] tracking-tight">${String(s).padStart(2, '0')}</span>
                             <span class="text-[10px] font-bold text-gray-300">s</span>
                           </div>
                         </div>
                       </div>`;

                const isHero = !item.isGoblin && item.rawId && String(item.rawId).startsWith('28');
                const slotBadge = item.slotBadge || (item.isGoblin ? '[GOBLIN]' : `[B${(item.builderIndex || 0) + 1}]`);
                const upgradeTitle = item.upgradeTitle || item.builderLabel || (item.isGoblin ? 'Goblin Builder' : 'Defense / Building Upgrade');
                const lvlChipClass = item.isGoblin ? 'lvl-chip-goblin' : 'lvl-chip';
                const lvlChipHtml = typeof item.upgradeLevel === 'number' ? `<span class="${lvlChipClass}">LVL ${item.upgradeLevel}</span>` : '';

                const cardAccentClass = item.isGoblin
                    ? 'goblin-card accent-goblin'
                    : isHero
                    ? 'bg-black/40 border-white/10 accent-hero'
                    : 'bg-black/40 border-white/10 accent-gold';

                const badgeClass = item.isGoblin
                    ? 'slot-badge-goblin'
                    : isHero
                    ? 'slot-badge-hero'
                    : 'slot-badge-regular';

                resultsContent.innerHTML += `
                    <div class="rounded-2xl p-4 border flex flex-col ${cardAccentClass}">
                        <div class="builder-header-sep flex flex-wrap items-center justify-between gap-2">
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="${badgeClass}">${slotBadge}</span>
                                <span class="upgrade-title">${upgradeTitle}</span>
                                ${lvlChipHtml}
                            </div>
                        </div>
                        <div class="flex items-baseline gap-2 mb-3">
                            <span class="text-[10px] uppercase tracking-wider text-gray-300 font-bold">Completes On:</span>
                            <span class="text-base font-extrabold text-gold">${item.formattedDate}</span>
                        </div>
                        <div id="hud-slot-${idx}" class="pt-2.5 border-t border-white/10">${tickerHTML}</div>
                    </div>
                `;
            });

            document.getElementById('result-saved').innerText = lockedSavedText;
        }

        function tickLiveHUD() {
            if (!lockedResults || lockedResults.length === 0) return;
            const now = Date.now();
            lockedResults.forEach((item, idx) => {
                const prev = prevTickMap[idx];
                if (!prev || prev.isFinished) return;

                const remMs = item.targetTimestamp - now;
                if (remMs <= 0) {
                    prev.isFinished = true;
                    triggerHaptic([30, 50, 30]);
                    const slot = document.getElementById(`hud-slot-${idx}`);
                    if (slot) {
                        slot.innerHTML = `<div class="badge-finished-glow w-full rounded-xl px-3 py-2.5 flex items-center justify-center gap-2 text-center">
                            <span class="text-xs sm:text-sm font-extrabold tracking-wide text-[#22c55e] uppercase">⚡ UPGRADE FINISHED! BUILDER FREE</span>
                        </div>`;
                    }
                    return;
                }

                const totalSecs = Math.ceil(remMs / 1000);
                const d = Math.floor(totalSecs / 86400);
                const h = Math.floor((totalSecs % 86400) / 3600);
                const m = Math.floor((totalSecs % 3600) / 60);
                const s = totalSecs % 60;

                if (s !== prev.s) {
                    const el = document.getElementById(`hud-val-s-${idx}`);
                    if (el) {
                        el.textContent = String(s).padStart(2, '0');
                        retriggerClass(el, 'anim-sec-flip');
                    }
                }
                if (m !== prev.m) {
                    const el = document.getElementById(`hud-val-m-${idx}`);
                    const box = document.getElementById(`hud-box-m-${idx}`);
                    if (el) el.textContent = String(m).padStart(2, '0');
                    retriggerClass(box, 'anim-min-pulse');
                }
                if (h !== prev.h) {
                    const el = document.getElementById(`hud-val-h-${idx}`);
                    const box = document.getElementById(`hud-box-h-${idx}`);
                    if (el) el.textContent = String(h).padStart(2, '0');
                    retriggerClass(box, 'anim-milestone-gold');
                }
                if (d !== prev.d) {
                    const el = document.getElementById(`hud-val-d-${idx}`);
                    const box = document.getElementById(`hud-box-d-${idx}`);
                    if (el) el.textContent = String(d).padStart(2, '0');
                    retriggerClass(box, 'anim-milestone-gold');
                }

                prevTickMap[idx] = { isFinished: false, d, h, m, s };
            });
        }

        window.onload = function() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed.builders)) buildersState = parsed.builders;
                    if (parsed.numBuilders) document.getElementById('input-builders').value = parsed.numBuilders;
                    if (parsed.potions) document.getElementById('input-potions').value = parsed.potions;
                    if (Array.isArray(parsed.lockedResults)) lockedResults = parsed.lockedResults;
                    if (parsed.lockedSavedText) lockedSavedText = parsed.lockedSavedText;
                    setMode(parsed.mode === 'multi' ? 'multi' : 'single', true);
                    if (lockedResults.length > 0) {
                        buildLockedResultsDOM();
                        document.getElementById('results-container').classList.remove('hidden-result');
                        document.getElementById('results-container').classList.add('show-result');
                    }
                } else {
                    updateBuilderInputs();
                }
            } catch (e) {
                updateBuilderInputs();
            }
            setInterval(tickLiveHUD, 1000);
        };
    </script>
</body>
</html>
